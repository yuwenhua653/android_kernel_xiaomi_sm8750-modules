name: Annibale ARM64 qualification
on:
  push:
    branches: [annibale-r47-build]
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: sm8750-modules
          persist-credentials: false
          fetch-depth: 1
      - name: Run regression tests before the kernel build
        working-directory: sm8750-modules
        run: |
          git fetch --no-tags --depth=1 origin e0ce4601d9cac01d9007e1ebae5931040c628929
          for compiler in gcc clang; do
            CC="$compiler" python3 -m unittest discover -s tools/tests -p test_annibale_offload_flow.py -v
            CC="$compiler" python3 -m unittest discover -s tools/tests -p test_annibale_network_controls.py -v
          done
          python3 -m unittest discover -s tools/tests -p test_annibale_rmnet_lifecycle.py -v
          python3 -m unittest discover -s tools/tests -p test_annibale_ci_toolchain.py -v
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: yuwenhua653/android_kernel_xiaomi_sm8750
          ref: 19ddf94a9513d4996e513decaa1d0d69430487c4
          path: sm8750
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: yuwenhua653/android_kernel_xiaomi_sm8750-devicetrees
          ref: efb44ba29a0a847b42519b0e87fed32d30df8904
          path: sm8750-devicetrees
          persist-credentials: false
          fetch-depth: 1
      - name: Prepare short physical build paths
        shell: bash
        run: |
          build_root=$(mktemp -d /tmp/ak.XXXXXX)
          echo "ANNIBALE_BUILD_ROOT=$build_root" >> "$GITHUB_ENV"
          for repo in sm8750 sm8750-modules sm8750-devicetrees; do
            revision=$(git -C "$GITHUB_WORKSPACE/$repo" rev-parse HEAD)
            git clone --shared --no-checkout "$GITHUB_WORKSPACE/$repo" "$build_root/$repo"
            git -C "$build_root/$repo" checkout --detach "$revision"
            test "$(git -C "$build_root/$repo" rev-parse HEAD)" = "$revision"
          done
          echo "Physical build root: $(realpath "$build_root")"
      - name: Install host build prerequisites
        timeout-minutes: 10
        run: |
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update -qq
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y bc bison flex libssl-dev libelf-dev cpio rsync
          df -h .
      - name: Build pinned Image and full selected module profile
        shell: bash
        run: |
          set -o pipefail
          cd "$ANNIBALE_BUILD_ROOT"
          mkdir -p ci-logs
          python3 -u sm8750-modules/tools/ci_annibale_arm64.py --workspace "$ANNIBALE_BUILD_ROOT" --jobs 4 2>&1 | tee ci-logs/qualification.log
      - name: Save build diagnostics
        if: always() && env.ANNIBALE_BUILD_ROOT != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: annibale-r47-build-diagnostics
          path: |
            ${{ env.ANNIBALE_BUILD_ROOT }}/ci-logs/*.log
            ${{ env.ANNIBALE_BUILD_ROOT }}/out/**/*.log
            ${{ env.ANNIBALE_BUILD_ROOT }}/out/provenance.json
            ${{ env.ANNIBALE_BUILD_ROOT }}/out/external/*/build.json
            ${{ env.ANNIBALE_BUILD_ROOT }}/out/external/*/verification.json
          if-no-files-found: warn
          retention-days: 14
      - name: Save verified qualification binaries
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: annibale-r47-ARM64-NOT-FLASHABLE
          path: ${{ env.ANNIBALE_BUILD_ROOT }}/artifacts/annibale-r47-ARM64-NOT-FLASHABLE.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
